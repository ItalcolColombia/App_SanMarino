<div class="irp-shell">
  <nav class="irp-modos" role="tablist" aria-label="Modo del informe">
    <button type="button" class="irp-modo" role="tab"
            [class.irp-modo--active]="modo === 'resumen'"
            [attr.aria-selected]="modo === 'resumen'"
            (click)="cambiarModo('resumen')">
      <span class="irp-modo__titulo">Resumen semanal</span>
      <span class="irp-modo__sub">Todos los lotes · una semana</span>
    </button>
    <button type="button" class="irp-modo" role="tab"
            [class.irp-modo--active]="modo === 'detalle'"
            [attr.aria-selected]="modo === 'detalle'"
            (click)="cambiarModo('detalle')">
      <span class="irp-modo__titulo">Detalle de lote</span>
      <span class="irp-modo__sub">Un lote · todas sus semanas</span>
    </button>
  </nav>

  <!--
    Los dos modos se OCULTAN, no se destruyen. Con `@if` el componente se
    remontaba en cada cambio y el usuario perdía el año/semana del Resumen y el
    lote base del Detalle: para volver a mirar el otro modo tenía que reelegir
    todo. Las gráficas siguen creándose solo cuando su propia vista está activa
    (están dentro de su `@if`), así que ocultar el contenedor no monta canvas
    invisibles.
  -->
  <div [hidden]="modo !== 'resumen'">
    <app-resumen-semanal-main />
  </div>
  <div [hidden]="modo !== 'detalle'">
    <app-reporte-tecnico-semanal-main />
  </div>
</div>
