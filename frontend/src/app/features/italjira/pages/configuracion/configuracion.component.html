<!-- src/app/features/italjira/pages/configuracion/admin-tickets.component.html -->
<div class="min-h-full bg-white bg-gradient-to-b from-ital-orange-50 via-white to-white">
  <div class="mx-auto max-w-5xl px-4 py-6 sm:px-6 sm:py-8">

    <!-- Hero header -->
    <div class="mb-6 flex flex-wrap items-center gap-3.5">
      <div class="grid h-12 w-12 place-items-center rounded-2xl bg-gradient-to-br from-slate-700 to-slate-900 text-white shadow-lg shadow-slate-900/20">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
      </div>
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-800">Administración de tickets</h1>
        <p class="text-sm text-ital-muted">Vista global de todos los tickets de todas las empresas.</p>
      </div>

      <!-- Accesos a las vistas de gestión -->
      <nav class="ml-auto flex items-center gap-1.5">
        <a routerLink="/italjira/tablero"
           class="inline-flex items-center gap-1.5 rounded-lg bg-white px-3 py-2 text-xs font-semibold text-slate-600 ring-1 ring-slate-200 transition hover:bg-slate-50 hover:text-slate-900">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25zm0 9.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18zM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25z" />
          </svg>
          Tablero
        </a>
        <a routerLink="/italjira/roadmap"
           class="inline-flex items-center gap-1.5 rounded-lg bg-white px-3 py-2 text-xs font-semibold text-slate-600 ring-1 ring-slate-200 transition hover:bg-slate-50 hover:text-slate-900">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
          </svg>
          Roadmap
        </a>
      </nav>
    </div>

    <!-- Filtros -->
    <section class="ux-card filter-card mb-5">
      <div class="filter-card__header">
        <div class="filter-card__header-icon" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 011-1h12a1 1 0 011 1v2.586a1 1 0 01-.293.707l-4.414 4.414a1 1 0 00-.293.707V15a1 1 0 01-.447.832l-2 1.333A1 1 0 018 16.333v-4.919a1 1 0 00-.293-.707L3.293 6.293A1 1 0 013 5.586V3z" clip-rule="evenodd"/></svg>
        </div>
        <div>
          <h3 class="filter-card__title">Filtros</h3>
          <p class="filter-card__subtitle">Acota la información mostrada</p>
        </div>
      </div>
      <div class="filter-fields">
        <div class="filter-field">
          <label class="filter-step__label" for="admin-tk-anio">Año</label>
          <select id="admin-tk-anio" [(ngModel)]="anio" (ngModelChange)="onFilterChange()" class="filter-step__select">
            @for (a of anios; track a) { <option [ngValue]="a">{{ a }}</option> }
          </select>
        </div>
        <div class="filter-field">
          <label class="filter-step__label" for="admin-tk-estado">Estado</label>
          <select id="admin-tk-estado" [(ngModel)]="estado" (ngModelChange)="onFilterChange()" class="filter-step__select">
            <option value="">Todos</option>
            @for (e of estados; track e) { <option [ngValue]="e">{{ estadoLabel[e] }}</option> }
          </select>
        </div>
        <div class="filter-field">
          <label class="filter-step__label" for="admin-tk-tipo">Tipo</label>
          <select id="admin-tk-tipo" [(ngModel)]="tipo" (ngModelChange)="onFilterChange()" class="filter-step__select">
            <option value="">Todos</option>
            @for (t of tipos; track t.value) { <option [ngValue]="t.value">{{ t.label }}</option> }
          </select>
        </div>
        <div class="filter-field">
          <label class="filter-step__label" for="admin-tk-pais">País</label>
          <select id="admin-tk-pais" [(ngModel)]="paisId" (ngModelChange)="onFilterChange()" class="filter-step__select">
            <option [ngValue]="null">Todos</option>
            @for (p of paises; track p.paisId) { <option [ngValue]="p.paisId">{{ p.paisNombre }}</option> }
          </select>
        </div>
        <div class="filter-field">
          <label class="filter-step__label" for="admin-tk-resolutor">Resolutor</label>
          <select id="admin-tk-resolutor" [(ngModel)]="assignedToGuid" (ngModelChange)="onFilterChange()" class="filter-step__select">
            <option [ngValue]="null">Todos</option>
            @for (r of resolutores; track r.guid) { <option [ngValue]="r.guid">{{ r.nombre }}</option> }
          </select>
        </div>
      </div>
    </section>

    <app-ticket-list
      [items]="data()?.items ?? []"
      [loading]="loading()"
      [page]="page"
      [totalPages]="totalPages()"
      [total]="data()?.total ?? 0"
      [showAsignado]="true"
      [showPais]="true"
      emptyText="No hay tickets para este filtro."
      (prev)="prevPage()"
      (next)="nextPage()">
    </app-ticket-list>
  </div>
</div>
