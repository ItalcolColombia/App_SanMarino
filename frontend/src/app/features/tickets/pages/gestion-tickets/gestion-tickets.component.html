<!-- src/app/features/tickets/pages/gestion-tickets/gestion-tickets.component.html -->
<div class="min-h-full bg-white bg-gradient-to-b from-ital-orange-50 via-white to-white">
  <div class="mx-auto max-w-5xl px-4 py-6 sm:px-6 sm:py-8">

    <!-- Hero header -->
    <div class="mb-6 flex items-center gap-3.5">
      <div class="grid h-12 w-12 place-items-center rounded-2xl bg-gradient-to-br from-ital-green to-ital-green-dark text-white shadow-lg shadow-ital-green/25">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 13.5h3.86a2.25 2.25 0 0 1 2.012 1.244l.256.512a2.25 2.25 0 0 0 2.013 1.244h3.218a2.25 2.25 0 0 0 2.013-1.244l.256-.512a2.25 2.25 0 0 1 2.013-1.244h3.859m-19.5.338V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18v-4.162c0-.224-.034-.447-.1-.661L19.24 5.338a2.25 2.25 0 0 0-2.15-1.588H6.911a2.25 2.25 0 0 0-2.15 1.588L2.35 13.177a2.25 2.25 0 0 0-.1.661Z"/></svg>
      </div>
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-800">Bandeja de gestión</h1>
        <p class="text-sm text-ital-muted">Tickets asignados a mí para atender y resolver.</p>
      </div>
    </div>

    <!-- Filtros -->
    <section class="ux-card filter-card mb-5">
      <div class="filter-card__header">
        <div class="filter-card__header-icon" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 011-1h12a1 1 0 011 1v2.586a1 1 0 01-.293.707l-4.414 4.414a1 1 0 00-.293.707V15a1 1 0 01-.447.832l-2 1.333A1 1 0 018 16.333v-4.919a1 1 0 00-.293-.707L3.293 6.293A1 1 0 013 5.586V3z" clip-rule="evenodd"/></svg>
        </div>
        <div>
          <h3 class="filter-card__title">Filtros</h3>
          <p class="filter-card__subtitle">Acota la información mostrada</p>
        </div>
      </div>
      <div class="filter-fields">
        <div class="filter-field">
          <label class="filter-step__label" for="gestion-tk-anio">Año</label>
          <select id="gestion-tk-anio" [(ngModel)]="anio" (ngModelChange)="onFilterChange()" class="filter-step__select">
            @for (a of anios; track a) { <option [ngValue]="a">{{ a }}</option> }
          </select>
        </div>
        <div class="filter-field">
          <label class="filter-step__label" for="gestion-tk-estado">Estado</label>
          <select id="gestion-tk-estado" [(ngModel)]="estado" (ngModelChange)="onFilterChange()" class="filter-step__select">
            <option value="">Todos</option>
            @for (e of estados; track e) { <option [ngValue]="e">{{ estadoLabel[e] }}</option> }
          </select>
        </div>
        <div class="filter-field">
          <label class="filter-step__label" for="gestion-tk-tipo">Tipo</label>
          <select id="gestion-tk-tipo" [(ngModel)]="tipo" (ngModelChange)="onFilterChange()" class="filter-step__select">
            <option value="">Todos</option>
            @for (t of tipos; track t.value) { <option [ngValue]="t.value">{{ t.label }}</option> }
          </select>
        </div>
      </div>
    </section>

    <app-ticket-list
      [items]="data()?.items ?? []"
      [loading]="loading()"
      [page]="page"
      [totalPages]="totalPages()"
      [total]="data()?.total ?? 0"
      [showAsignado]="true"
      emptyText="No hay tickets en tu bandeja para este filtro."
      (prev)="prevPage()"
      (next)="nextPage()">
    </app-ticket-list>
  </div>
</div>
