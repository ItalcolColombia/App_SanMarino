# =============================================================================
# Headers de seguridad compartidos
# =============================================================================
# POR QUÉ ESTE ARCHIVO EXISTE:
#
# En nginx, `add_header` NO se acumula entre niveles: si un bloque `location`
# declara aunque sea UN `add_header`, se descartan TODOS los del bloque `server`
# padre. Como cada location de este sitio declaraba sus propios headers, la
# configuración anterior servía `index.html` y todos los `.js` **sin
# Content-Security-Policy y sin Strict-Transport-Security** — verificado contra
# producción el 2026-07-27: la respuesta de `/` sólo traía X-Content-Type-Options
# y X-Frame-Options, justo los dos que cada location repetía a mano.
#
# Con un Service Worker eso importa mucho más que antes: el radio de un XSS pasa
# de "una sesión" a "toda la base offline y la cola de sincronización".
#
# REGLA: todo bloque `location` de nginx.conf tiene que hacer
#        `include /etc/nginx/security-headers.conf;`
#        No agregues headers sueltos en un location; agregalos acá.
# =============================================================================

# Content-Security-Policy — previene XSS e inyección de contenido.
# 'unsafe-inline' y 'unsafe-eval' siguen siendo necesarios para Angular.
# frame-ancestors 'none' previene clickjacking (reemplaza a X-Frame-Options).
# worker-src / manifest-src están explícitos porque son los que habilitan el
# Service Worker y el manifest de la PWA (heredarían de default-src, pero
# dejarlos escritos evita que un cambio futuro de default-src los rompa en silencio).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

# Strict-Transport-Security — fuerza HTTPS.
# nginx recibe HTTP en el puerto 80; el ALB termina HTTPS por delante.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Redundante con frame-ancestors, se mantiene por compatibilidad.
add_header X-Frame-Options "DENY" always;

# Previene MIME type sniffing. Crítico: en TODAS las respuestas.
add_header X-Content-Type-Options "nosniff" always;

# Protección adicional contra XSS (navegadores antiguos).
add_header X-XSS-Protection "1; mode=block" always;

# Controla qué información de referrer se envía.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Controla qué APIs del navegador están disponibles.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;

# Headers adicionales de endurecimiento.
add_header X-Download-Options "noopen" always;
add_header X-DNS-Prefetch-Control "off" always;
