# =============================================================================
# Front ItalGranja — nginx del contenedor ECS
# =============================================================================
# Este es el ÚNICO origen del frontend en producción (verificado 2026-07-27:
# la respuesta de prod trae `Server: nginx` y ningún header de CloudFront).
# El camino S3+CloudFront que había en el repo apuntaba a otra cuenta AWS y
# quedó archivado en frontend/deploy/ARCHIVADO-s3-cloudfront/.
#
# ORDEN DE LOS BLOQUES — no reordenar a la ligera. nginx resuelve así:
#   1) `location = /ruta`      (exacto)      <- los archivos de control del SW
#   2) `location ^~ /prefijo`  (prefijo con corte)
#   3) `location ~* regex`     (en orden de aparición)
#   4) `location /prefijo`     (prefijo más largo)
# Los `location =` de arriba TIENEN que quedar antes del regex de assets, si no
# `ngsw-worker.js` cae en la regla `immutable` y el navegador se queda con un
# Service Worker viejo cacheado un año.
#
# HEADERS: cada location incluye security-headers.conf. Ver ese archivo para
# entender por qué no alcanza con declararlos en el bloque `server`.
# =============================================================================

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Ocultar versión de nginx
  server_tokens off;

  # Compresión gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/manifest+json
    application/xml+rss
    application/rss+xml
    font/truetype
    font/opentype
    application/vnd.ms-fontobject
    image/svg+xml;

  # ===========================================================================
  # 1) Archivos de control del Service Worker y de versión — SIEMPRE no-cache
  # ===========================================================================
  # Si cualquiera de estos se cachea, la PWA deja de poder actualizarse:
  #  - ngsw.json        es el manifiesto de versión; cacheado = el SW nunca ve el deploy nuevo
  #  - ngsw-worker.js   es el worker; cacheado un año = kill switch inservible
  #  - safety-worker.js es el kill switch; tiene que poder desplegarse y tomar efecto ya
  #  - version.json     lo consulta VersionCheckService; cacheado = nunca detecta el deploy
  # `try_files $uri =404` es deliberado: si el archivo no existe tiene que dar 404,
  # NUNCA el index.html (ver bloque 3).

  location = /ngsw.json {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /ngsw-worker.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /safety-worker.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /worker-basic.min.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    # nginx no conoce la extensión .webmanifest en su mime.types por defecto
    types { }
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location = /version.json {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    types { }
    default_type application/json;
    try_files $uri =404;
  }

  location = /index.html {
    include /etc/nginx/security-headers.conf;
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
  }

  # ===========================================================================
  # 2) Assets con hash en el nombre — cache larga
  # ===========================================================================
  # Seguro porque `outputHashing: all` cambia el nombre en cada build.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
    include /etc/nginx/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    try_files $uri =404;
  }

  # ===========================================================================
  # 3) Recursos NO navegables que falten -> 404, nunca index.html
  # ===========================================================================
  # Este bloque es el arreglo del bug verificado en prod el 2026-07-27:
  # `/ngsw.json`, `/manifest.webmanifest` y cualquier `.json` devolvían
  # **200 con Content-Type text/html** y el cuerpo del index.html, porque caían
  # en el `try_files ... /index.html` del bloque 4.
  # Para un Service Worker eso es fatal: recibe HTML donde espera JSON, no puede
  # validarlo, y se desactiva en silencio. Criterio de aceptación:
  #   curl -i https://<host>/chunk-inexistente.js   -> 404
  #   curl -i https://<host>/ngsw.json (sin build)  -> 404
  location ~* \.(json|webmanifest|map|txt|xml|wasm|webp|avif|mp4|webm|pdf|zip|csv|xlsx)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # ===========================================================================
  # 4) Rutas del SPA -> fallback a index.html (SOLO navegaciones)
  # ===========================================================================
  # Llegan acá únicamente los paths sin extensión conocida, que son las rutas
  # de Angular. Cualquier archivo con extensión ya se resolvió arriba.
  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # ===========================================================================
  # 5) Utilidades
  # ===========================================================================

  # Bloquear acceso a archivos ocultos
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  # Healthcheck del contenedor (lo usa el HEALTHCHECK del Dockerfile y el ALB)
  location /health {
    include /etc/nginx/security-headers.conf;
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}
