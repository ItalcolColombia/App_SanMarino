# =============================================================================
# CI/CD Pipeline — San Marino App (Producción)
# =============================================================================
# Dispara cuando se hace push o merge a la rama main-produccion.
# Construye las imágenes Docker de frontend y backend, las publica en ECR
# y actualiza los servicios ECS con rolling deployment automático.
#
# Prerequisitos:
#   1. OIDC provider configurado en IAM para token.actions.githubusercontent.com
#   2. Rol IAM  github-actions-deploy  con la política adjunta (ver docs/iam-policy.json)
#   3. Los servicios ECS y task definitions ya deben existir en AWS
# =============================================================================

name: Deploy to Production

on:
  # Dispara en push directo a main-produccion (incluye merges de PR).
  # OIDC subject claim para push: repo:ItalcolColombia/App_SanMarino:ref:refs/heads/main-produccion
  # (el trigger pull_request:closed emite subject "pull_request", que el rol IAM rechaza)
  push:
    branches:
      - main-produccion
  # Permite disparar manualmente desde la pestaña Actions de GitHub
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Desplegar backend"
        type: boolean
        default: true
      deploy_frontend:
        description: "Desplegar frontend"
        type: boolean
        default: true

# OIDC requiere este permiso para solicitar el JWT
permissions:
  id-token: write
  contents: read

# ─── Variables compartidas entre jobs ────────────────────────────────────────
env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "196080479890"
  ECS_CLUSTER: devSanmarinoZoo

# =============================================================================
# Nota: la detección de cambios con dorny/paths-filter fue removida porque
# comparaba main vs main-produccion; tras un merge ambas ramas quedan en el
# mismo SHA → diff 0 → jobs saltados. En su lugar, todo push a
# main-produccion dispara backend y frontend; el workflow_dispatch respeta
# sus inputs deploy_backend / deploy_frontend.
# =============================================================================

jobs:
  # ===========================================================================
  # JOB 0 — Gate de tests: NADA se despliega si los tests no pasan
  # ===========================================================================
  # CLAUDE.md afirmaba que este gate existía desde hacía tiempo; no existía. El
  # workflow tenía 296 líneas y cero `dotnet test` / `yarn test`. Del lado del
  # frontend además el harness estaba roto de raíz: `tsconfig.spec.json` heredaba
  # `exclude: ["**/*.spec.ts"]` de `tsconfig.json`, así que `ng test` moría con
  # TS18003 ("No inputs were found") sin llegar a ejecutar un solo spec.
  #
  # No relajar ni saltear esta compuerta para "sacar rápido": si un módulo no tiene
  # test para lo que se tocó, se escribe antes de mergear.
  tests:
    name: "Tests — Backend & Frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # ── Backend: xUnit ──────────────────────────────────────────────────────
      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tests del backend
        working-directory: backend
        run: dotnet test --configuration Release --logger "console;verbosity=normal"

      # ── Frontend: Karma + Jasmine sobre Chrome headless ─────────────────────
      # ubuntu-latest trae Google Chrome preinstalado; karma-chrome-launcher lo
      # localiza vía CHROME_BIN.
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive --network-timeout 100000

      - name: Tests del frontend
        working-directory: frontend
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: yarn test --watch=false --browsers=ChromeHeadless

      # Tres defectos que compilan, pasan los tests y solo se ven abriendo la pantalla (o abriéndola
      # sin red, o meses después como un saldo que no cuadra). Por eso son gates de máquina y no una
      # convención escrita.
      - name: Gate — changeDetection explícito en cada @Component
        working-directory: frontend
        run: node scripts/verificar-change-detection.js

      - name: Gate — lista cacheable sincronizada con el código
        working-directory: frontend
        run: node scripts/verificar-lista-cacheable.js

      - name: Gate — ninguna pantalla de seguimiento descuenta inventario
        working-directory: frontend
        run: node scripts/verificar-front-no-descuenta-inventario.js

      # Nada aplica `backend/sql/` solo: ni el arranque ni el deploy. Un fn_/vw_ que vive sólo como
      # archivo parece trabajo entregado y producción nunca lo tiene.
      - name: Gate — todo fn_/vw_ de SQL llega por migración
        working-directory: backend
        run: node scripts/verificar-sql-llega-por-migracion.js

      # F7: requiere_cuadre sólo lo puede emitir SyncPushService (la decisión se toma ANTES del
      # throw, reintentando sin ítems). Un segundo emisor copiado en el camino directo desandaría
      # la atomicidad que F3 instaló ahí.
      - name: Gate — requiere_cuadre solo lo emite SyncPushService
        working-directory: backend
        run: node scripts/verificar-cuadre-solo-en-sync.js

      - name: Resumen
        if: success()
        run: echo "### Gate de tests superado" >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # JOB 1 — Backend: Build → ECR → ECS
  # ===========================================================================
  deploy-backend:
    name: "Backend — Build & Deploy"
    runs-on: ubuntu-latest
    needs: [tests]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_backend == true)
    timeout-minutes: 30

    env:
      ECR_REPOSITORY: sanmarino/zootecnia/granjas/backend
      ECS_SERVICE: sanmarino-back-task-service-75khncfa
      ECS_TASK_FAMILY: sanmarino-back-task
      CONTAINER_NAME: backend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # ── Autenticación AWS vía OIDC (sin claves estáticas) ──────────────────
      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Backend-${{ github.run_number }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Calcular tags de imagen ─────────────────────────────────────────────
      # Se usan dos tags: el SHA del commit (trazabilidad) y latest (referencia rápida)
      - name: Calcular tags de imagen
        id: tags
        run: |
          REGISTRY="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          REPO="${{ env.ECR_REPOSITORY }}"
          SHA="${{ github.sha }}"

          echo "image_sha=${REGISTRY}/${REPO}:${SHA}"   >> "$GITHUB_OUTPUT"
          echo "image_latest=${REGISTRY}/${REPO}:latest" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}"                    >> "$GITHUB_OUTPUT"

          echo "### Backend Image Tags" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`${SHA}\`"      >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${REGISTRY}/${REPO}:${SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      # ── Build Docker ────────────────────────────────────────────────────────
      # Se usa --cache-from para reutilizar capas de la imagen latest anterior.
      # --platform linux/amd64 garantiza compatibilidad con Fargate x86_64.
      - name: Pull imagen anterior (cache)
        run: docker pull ${{ steps.tags.outputs.image_latest }} || true

      - name: Build imagen Docker
        working-directory: backend
        run: |
          docker build \
            --platform linux/amd64 \
            --file Dockerfile \
            --cache-from ${{ steps.tags.outputs.image_latest }} \
            --tag ${{ steps.tags.outputs.image_sha }} \
            --tag ${{ steps.tags.outputs.image_latest }} \
            --label "git.sha=${{ github.sha }}" \
            --label "git.ref=${{ github.ref }}" \
            --label "build.run=${{ github.run_number }}" \
            .

      # ── Push a ECR ──────────────────────────────────────────────────────────
      - name: Push imágenes a ECR
        run: |
          docker push ${{ steps.tags.outputs.image_sha }}
          docker push ${{ steps.tags.outputs.image_latest }}

      # ── Desplegar en ECS ────────────────────────────────────────────────────
      # Estrategia: descargar task definition actual de ECS, actualizar sólo
      # el campo image, registrar nueva revisión y actualizar el servicio.
      # Así los secretos y variables de entorno no tocan GitHub Actions.
      - name: Obtener task definition actual de ECS
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_FAMILY }} \
            --query 'taskDefinition' \
            --output json \
            | jq 'del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )' \
            > /tmp/task-def-backend.json

          echo "Task definition descargada correctamente."

      - name: Actualizar imagen en task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/task-def-backend.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.tags.outputs.image_sha }}

      - name: Desplegar en ECS (rolling deployment)
        id: deploy-ecs
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 25
          force-new-deployment: true

      - name: Resumen de despliegue
        if: success()
        run: |
          echo "### Backend desplegado exitosamente" >> "$GITHUB_STEP_SUMMARY"
          echo "- Servicio: \`${{ env.ECS_SERVICE }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cluster: \`${{ env.ECS_CLUSTER }}\`"  >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagen: \`${{ steps.tags.outputs.image_sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # JOB 2 — Frontend: Build → ECR → ECS
  # ===========================================================================
  deploy-frontend:
    name: "Frontend — Build & Deploy"
    runs-on: ubuntu-latest
    # El frontend se despliega DESPUÉS del backend, nunca en paralelo.
    # Si sale primero, los clientes quedan con un bundle que le habla a un backend que
    # todavía no tiene los endpoints nuevos. Hoy esa ventana dura minutos; con un Service
    # Worker cacheando el bundle pasa a durar días.
    #
    # El `if` es explícito porque `needs` por sí solo saltearía el frontend cuando el
    # backend se saltea a propósito (workflow_dispatch con deploy_backend=false):
    #  - tests SIEMPRE tiene que haber pasado;
    #  - deploy-backend puede haber pasado O haberse salteado, pero nunca fallado.
    needs: [tests, deploy-backend]
    if: |
      always() &&
      needs.tests.result == 'success' &&
      (needs['deploy-backend'].result == 'success' || needs['deploy-backend'].result == 'skipped') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy_frontend == true))
    timeout-minutes: 30

    env:
      ECR_REPOSITORY: sanmarino/zootecnia/granjas/frontend
      ECS_SERVICE: sanmarino-front-task-service-zp2f403l
      ECS_TASK_FAMILY: sanmarino-front-task
      CONTAINER_NAME: frontend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Frontend-${{ github.run_number }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Calcular tags de imagen
        id: tags
        run: |
          REGISTRY="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          REPO="${{ env.ECR_REPOSITORY }}"
          SHA="${{ github.sha }}"

          echo "image_sha=${REGISTRY}/${REPO}:${SHA}"   >> "$GITHUB_OUTPUT"
          echo "image_latest=${REGISTRY}/${REPO}:latest" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}"                    >> "$GITHUB_OUTPUT"

          echo "### Frontend Image Tags" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`${SHA}\`"       >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${REGISTRY}/${REPO}:${SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Pull imagen anterior (cache)
        run: docker pull ${{ steps.tags.outputs.image_latest }} || true

      # El Dockerfile del frontend usa  --configuration docker  (angular.json)
      # que genera el bundle de producción con environment.prod.ts
      - name: Build imagen Docker
        working-directory: frontend
        run: |
          docker build \
            --platform linux/amd64 \
            --file Dockerfile \
            --cache-from ${{ steps.tags.outputs.image_latest }} \
            --tag ${{ steps.tags.outputs.image_sha }} \
            --tag ${{ steps.tags.outputs.image_latest }} \
            --label "git.sha=${{ github.sha }}" \
            --label "git.ref=${{ github.ref }}" \
            --label "build.run=${{ github.run_number }}" \
            .

      # ── Guarda del borde: la imagen NO se publica si nginx no valida ────────
      # Verifica sobre la imagen ya construida los criterios que hacen que un
      # Service Worker pueda vivir (§9 del plan PWA). Corre ANTES del push a ECR
      # para que una configuración rota no llegue nunca a ECS.
      - name: Validar nginx y política de caché del borde
        run: |
          set -u
          IMG="${{ steps.tags.outputs.image_sha }}"

          echo "== nginx -t (sintaxis) =="
          docker run --rm "$IMG" nginx -t

          echo "== levantando el contenedor =="
          docker rm -f front-check >/dev/null 2>&1 || true
          docker run -d --name front-check -p 8099:80 "$IMG" >/dev/null
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8099/health >/dev/null && break
            sleep 1
          done

          H=http://localhost:8099
          fallos=0
          check() { # descripción, url, patrón esperado en los headers
            out=$(curl -s -o /dev/null -D - --max-time 10 "$2")
            if echo "$out" | grep -qiE "$3"; then
              echo "  OK    $1"
            else
              echo "  FALLA $1 (no matchea: $3)"
              echo "$out" | sed 's/^/        /' | head -20
              fallos=$((fallos+1))
            fi
          }

          echo "== C2: recursos no navegables inexistentes -> 404, NUNCA index.html =="
          # Antes del arreglo estos devolvían 200 con Content-Type text/html y el cuerpo
          # del index; un Service Worker recibe HTML donde espera JSON y se desactiva solo.
          # Las rutas son inexistentes A PROPÓSITO y tienen que seguir siéndolo: hasta el
          # 2026-08-09 acá se pedía 404 de `ngsw.json` y `manifest.webmanifest`, que en ese
          # momento el build no emitía. Desde que la app es PWA (8ecb7c6) los emite, empezaron
          # a responder 200 y el gate frenó todos los deploys del front. El invariante que este
          # bloque cuida es el de la extensión, no el de esos dos archivos: van más abajo, en C4.
          check "chunk-inexistente.js -> 404"      "$H/chunk-inexistente.js"        "^HTTP/[0-9.]+ 404"
          check ".json inexistente -> 404"         "$H/no-existe-1234.json"         "^HTTP/[0-9.]+ 404"
          check ".webmanifest inexistente -> 404"  "$H/no-existe-1234.webmanifest"  "^HTTP/[0-9.]+ 404"
          check "ruta del SPA -> 200"              "$H/lotes/detalle/9"             "^HTTP/[0-9.]+ 200"

          echo "== C3: archivos de control con no-cache =="
          check "version.json -> no-cache"         "$H/version.json"            "^Cache-Control:.*no-cache"
          check "index.html -> no-cache"           "$H/index.html"              "^Cache-Control:.*no-cache"

          echo "== C3: los assets con hash siguen immutable =="
          JS=$(curl -s "$H/" | grep -oE 'src="[^"]+\.js"' | head -1 | sed 's/src="//;s/"//')
          echo "  (asset de referencia: ${JS:-ninguno})"
          [ -n "$JS" ] && check "$JS -> immutable"  "$H/$JS"                    "^Cache-Control:.*immutable"

          echo "== C4: los archivos de control del Service Worker se publican y NO se cachean =="
          # La otra mitad de C2: lo que la PWA necesita servido, servido bien.
          # `verificar-ngsw.js` (dentro del Dockerfile) comprueba el CONTENIDO del build;
          # esto comprueba cómo lo sirve nginx, que es otra cosa y falla distinto:
          #  - Content-Type text/html en vez de JSON => el SW no puede validar el manifiesto
          #    y arranca en safe mode, en silencio: se despliega bien y no anda sin red.
          #  - `ngsw-worker.js`/`safety-worker.js` cayendo en la regla `immutable` de assets
          #    (bloque 2 de nginx.conf) => el navegador se queda un año con el worker viejo
          #    y el kill switch queda inservible el día que haga falta.
          check "ngsw.json -> 200"                  "$H/ngsw.json"              "^HTTP/[0-9.]+ 200"
          check "ngsw.json -> application/json"     "$H/ngsw.json"              "^Content-Type:.*application/json"
          check "ngsw.json -> no-cache"             "$H/ngsw.json"              "^Cache-Control:.*no-cache"
          check "ngsw-worker.js -> 200"             "$H/ngsw-worker.js"         "^HTTP/[0-9.]+ 200"
          check "ngsw-worker.js -> no-cache"        "$H/ngsw-worker.js"         "^Cache-Control:.*no-cache"
          check "safety-worker.js -> 200"           "$H/safety-worker.js"       "^HTTP/[0-9.]+ 200"
          check "safety-worker.js -> no-cache"      "$H/safety-worker.js"       "^Cache-Control:.*no-cache"
          check "manifest.webmanifest -> 200"       "$H/manifest.webmanifest"   "^HTTP/[0-9.]+ 200"
          check "manifest -> manifest+json"         "$H/manifest.webmanifest"   "^Content-Type:.*application/manifest\+json"
          check "manifest.webmanifest -> no-cache"  "$H/manifest.webmanifest"   "^Cache-Control:.*no-cache"

          echo "== C5: CSP y HSTS en TODAS las respuestas =="
          check "/ -> CSP"                          "$H/"                       "^Content-Security-Policy:"
          check "/ -> HSTS"                         "$H/"                       "^Strict-Transport-Security:"
          check "/ -> worker-src en la CSP"         "$H/"                       "worker-src 'self'"
          # El login de prod renderiza reCAPTCHA: la CSP tiene que permitir el script
          # (script-src google/gstatic) y el iframe (frame-src). Se rompió el 2026-07-27
          # cuando la CSP centralizada empezó a aplicarse de verdad sin estos orígenes.
          check "/ -> recaptcha en script-src"      "$H/"                       "script-src[^;]*https://www\.google\.com/recaptcha/"
          check "/ -> recaptcha en frame-src"       "$H/"                       "frame-src[^;]*https://www\.google\.com/recaptcha/"
          [ -n "$JS" ] && check "$JS -> CSP"         "$H/$JS"                    "^Content-Security-Policy:"
          [ -n "$JS" ] && check "$JS -> HSTS"        "$H/$JS"                    "^Strict-Transport-Security:"
          check "ruta del SPA -> CSP"               "$H/lotes/detalle/9"        "^Content-Security-Policy:"

          docker logs front-check 2>&1 | tail -20 || true
          docker rm -f front-check >/dev/null 2>&1 || true

          if [ "$fallos" -ne 0 ]; then
            echo "::error::La imagen del frontend no cumple $fallos criterio(s) del borde. No se publica."
            exit 1
          fi
          echo "Borde OK."

      - name: Push imágenes a ECR
        run: |
          docker push ${{ steps.tags.outputs.image_sha }}
          docker push ${{ steps.tags.outputs.image_latest }}

      - name: Obtener task definition actual de ECS
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_FAMILY }} \
            --query 'taskDefinition' \
            --output json \
            | jq 'del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )' \
            > /tmp/task-def-frontend.json

          echo "Task definition descargada correctamente."

      - name: Actualizar imagen en task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/task-def-frontend.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.tags.outputs.image_sha }}

      - name: Desplegar en ECS (rolling deployment)
        id: deploy-ecs
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 25
          force-new-deployment: true

      - name: Resumen de despliegue
        if: success()
        run: |
          echo "### Frontend desplegado exitosamente" >> "$GITHUB_STEP_SUMMARY"
          echo "- Servicio: \`${{ env.ECS_SERVICE }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cluster: \`${{ env.ECS_CLUSTER }}\`"  >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagen: \`${{ steps.tags.outputs.image_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
