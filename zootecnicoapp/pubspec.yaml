name: zootecnicoapp
description: San Marino Zootécnico — seguimiento diario avícola offline-first
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Base de datos local — la app es offline-first
  sqflite: ^2.4.1
  path: ^1.9.0

  # Detección de red para la cola de sincronización
  connectivity_plus: ^6.1.0

  # Cliente HTTP
  dio: ^5.7.0

  # Preferencias (sesión, autoSync)
  shared_preferences: ^2.3.3

  # Formato de fechas y números es-CO
  intl: ^0.19.0

  # AES-256-CBC + PBKDF2-SHA256 — el backend cifra el login en las dos direcciones
  # y exige el SECRET_UP cifrado en toda ruta autenticada (ver core/crypto/).
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true

  assets:
    - assets/images/brand/
    - assets/fonts/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
